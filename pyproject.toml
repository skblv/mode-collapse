[project]
name = "mode-collapse"
version = "0.1.0"
description = "Code for the paper Fine-Tuning Fixes Mode Collapse and Over-Dispersion in LLMs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.14.0",
    "matplotlib==3.11.0",
    "numpy==2.5.0",
    "pandas==3.0.3",
    "peft==0.19.1",
    "scipy==1.17.1",
    "torch==2.12.1",
    "tqdm==4.68.3",
    "transformers==5.12.1",
    "wandb==0.28.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "2026-06-28T00:00:00Z"

[tool.hatch.build.targets.wheel]
packages = ["src/mode_collapse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "experiments", "tests"]
extend-exclude = ["tests/codenet/fixture"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "PLC0415", "Q", "UP", "W"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
