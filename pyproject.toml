[project]
name = "mode-collapse"
version = "0.1.0"
description = "Code for the paper Fine-Tuning Fixes Mode Collapse and Over-Dispersion in LLMs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate",
    "matplotlib",
    "numpy",
    "pandas",
    "peft>=0.19,<0.20",
    "scipy",
    "torch",
    "tqdm",
    "transformers>=5.2,<5.15",
    "wandb",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Transformers 5.2 adds the Qwen3.5 classes and 5.15 removes warmup_ratio.
[tool.uv]
exclude-newer = "2026-07-20T00:00:00Z"

[tool.hatch.build.targets.wheel]
packages = ["src/mode_collapse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "experiments", "tests"]
extend-exclude = ["tests/codenet/fixture"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "PLC0415", "Q", "UP", "W"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
